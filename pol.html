    <style>
        /* نفس الأنماط السابقة - محذوفة للاختصار، لكن يمكنك إضافتها كاملة */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        :root {
            --bg: #0b0e17;
            --card: #141a2b;
            --border: #2a3a5c;
            --primary: #6c5ce7;
            --primary-glow: #6c5ce766;
            --accent: #00d4ff;
            --green: #00b894;
            --red: #e17055;
            --gold: #fdcb6e;
            --text: #dfe6e9;
            --text-dim: #7f8fa6;
            --radius: 16px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
        }
        #app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 860px;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--border);
        }
        /* باقي الأنماط ... (اختصاراً، لكن الكود الكامل موجود في الرد السابق) */
        .auth-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            flex: 1;
            gap: 20px;
        }
        .auth-screen .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .auth-screen .sub {
            color: var(--text-dim);
            font-size: 14px;
            margin-top: -8px;
        }
        .auth-box {
            width: 100%;
            max-width: 340px;
            background: var(--bg);
            border-radius: var(--radius);
            padding: 24px 20px;
            border: 1px solid var(--border);
        }
        .auth-box h3 {
            text-align: center;
            margin-bottom: 18px;
            font-weight: 600;
            font-size: 18px;
        }
        .auth-box input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
            transition: 0.2s;
        }
        .auth-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .auth-box .btn-primary {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), #8b7cf7);
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 4px;
        }
        .auth-box .btn-primary:hover {
            transform: scale(1.01);
            opacity: 0.92;
        }
        .auth-box .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 8px;
            transition: 0.2s;
        }
        .auth-box .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--text);
        }
        .auth-box .switch-link {
            text-align: center;
            margin-top: 14px;
            font-size: 13px;
            color: var(--text-dim);
        }
        .auth-box .switch-link span {
            color: var(--accent);
            cursor: pointer;
            font-weight: 600;
        }
        .auth-box .referral-badge {
            background: var(--gold);
            color: #000;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
        }
        .auth-error {
            color: var(--red);
            font-size: 13px;
            text-align: center;
            margin-top: 6px;
            min-height: 20px;
        }
        /* ... باقي الأنماط ... */
        .hidden {
            display: none !important;
        }
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            font-size: 14px;
            z-index: 999;
            max-width: 90%;
            text-align: center;
            animation: fadeIn 0.3s;
        }
        .toast.success {
            border-color: var(--green);
            color: var(--green);
        }
        .toast.error {
            border-color: var(--red);
            color: var(--red);
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
    </style>

        // =====================================================================

        // =====================================================================
        function toast(msg, type = '') {
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const el = document.createElement('div');
            el.className = 'toast ' + type;
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 4000);

        function getRefCode() {
            const params = new URLSearchParams(window.location.search);
            return params.get('ref') || null;
        }

        function generateRefCode() {
            return Math.random().toString(36).substring(2, 10).toUpperCase();

        function getFruitById(id) { return FRUITS.find(f => f.id === id); }

        // =====================================================================
        //  ENCRYPTION
        // =====================================================================
        async function deriveKey(password, salt) {
            const enc = new TextEncoder();
            const keyMat = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
            return crypto.subtle.deriveKey({
                    name: 'PBKDF2',
                    salt: enc.encode(salt),
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                keyMat, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
            );
        }

        async function encryptPrivateKey(privateKey, password) {
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const key = await deriveKey(password, salt);
            const enc = new TextEncoder();
            const data = await crypto.subtle.encrypt({ name: 'AES-GCM', iv },
                key,
                enc.encode(privateKey)
            );
            const combined = new Uint8Array(salt.length + iv.length + data.byteLength);
            combined.set(salt, 0);
            combined.set(iv, salt.length);
            combined.set(new Uint8Array(data), salt.length + iv.length);
            return btoa(String.fromCharCode(...combined));
        }

        async function decryptPrivateKey(encrypted, password) {
            const raw = Uint8Array.from(atob(encrypted), c => c.charCodeAt(0));
            const salt = raw.slice(0, 16);
            const iv = raw.slice(16, 28);
            const data = raw.slice(28);
            const key = await deriveKey(password, salt);
            const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv },
                key,
                data
            );
            return new TextDecoder().decode(dec);
        }

        // =====================================================================
        //  WALLET
        // =====================================================================
        async function createWallet() {
            const wallet = ethers.Wallet.createRandom();
            return {
                address: wallet.address,
                privateKey: wallet.privateKey,
                mnemonic: wallet.mnemonic.phrase,
            };
        }

        async function getPolPrice() {
            try {
                const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=matic-network&vs_currencies=usd');
                const data = await res.json();
                return data['matic-network']?.usd || 0.5;
            } catch {
                return 0.5;
            }
        }

        // =====================================================================
        //  AUTH - المحور الرئيسي (تم التصحيح)
        // =====================================================================
        let isLogin = true;

        function toggleAuthMode() {
            isLogin = !isLogin;
            authTitle.textContent = isLogin ? 'تسجيل الدخول' : 'إنشاء حساب';
            authSubmitBtn.textContent = isLogin ? 'دخول' : 'إنشاء حساب';
            authSwitchBtn.textContent = isLogin ? 'إنشاء حساب جديد' : 'لدي حساب بالفعل';
            authSwitchText.textContent = isLogin ? 'ليس لديك حساب؟ إنشاء حساب' : 'لديك حساب؟ تسجيل الدخول';
            authError.textContent = '';
            const ref = getRefCode();
            referralBadge.classList.toggle('hidden', isLogin || !ref);
        }

        authSwitchBtn.addEventListener('click', toggleAuthMode);
        authSwitchText.addEventListener('click', toggleAuthMode);

        authSubmitBtn.addEventListener('click', async () => {
            const email = authEmail.value.trim();
            const password = authPassword.value;
            if (!email || !password) { authError.textContent = 'يرجى ملء جميع الحقول'; return; }
            authError.textContent = '';
            authSubmitBtn.disabled = true;
            authSubmitBtn.textContent = 'جاري...';

            try {
                if (isLogin) {
                    await handleLogin(email, password);
                } else {
                    await handleRegister(email, password);
                }
            } catch (e) {
                authError.textContent = e.message || 'حدث خطأ';
                authSubmitBtn.disabled = false;
                authSubmitBtn.textContent = isLogin ? 'دخول' : 'إنشاء حساب';
            }
        });

        async function handleLogin(email, password) {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) throw new Error(error.message);
            await loadUserData(password);
            showApp();
            toast('تم تسجيل الدخول بنجاح', 'success');
            authSubmitBtn.disabled = false;
            authSubmitBtn.textContent = 'دخول';
        }

        async function handleRegister(email, password) {
            // 1. التحقق من عدم وجود المستخدم مسبقاً في profiles
            const { data: existingProfile } = await supabaseClient
                .from('profiles')
                .select('id')
                .eq('email', email)
                .maybeSingle();

            if (existingProfile) {
                throw new Error('البريد الإلكتروني مستخدم بالفعل');
            }

            // 2. إنشاء المحفظة
            const wallet = await createWallet();
            const encrypted = await encryptPrivateKey(wallet.privateKey, password);

            // 3. التسجيل في Supabase Auth
            const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                email,
                password,
                options: {
                    data: {
                        public_address: wallet.address
                    }
                }
            });

            if (authError) {
                // إذا كان المستخدم موجوداً في Auth ولكن ليس في profiles (حالة نادرة)
                if (authError.message.includes('already registered')) {
                    throw new Error('البريد الإلكتروني مسجل بالفعل، يرجى تسجيل الدخول');
                }
                throw new Error(authError.message);
            }

            const userId = authData.user.id;
            const refCode = generateRefCode();
            const referredBy = getRefCode();

            // 4. إدراج البيانات في جدول profiles
            const { error: profileError } = await supabaseClient
                .from('profiles')
                .insert({
                    id: userId,
                    email: email,
                    public_address: wallet.address,
                    encrypted_private_key: encrypted,
                    balance: 10,
                    referral_code: refCode,
                    referred_by: referredBy || null,
                    is_admin: email === ADMIN_EMAIL,
                    is_banned: false,
                    ban_expires: null,
                    username: email.split('@')[0],
                });

            if (profileError) {
                // إذا فشل الإدراج، نحذف المستخدم من Auth للحفاظ على التكامل
                await supabaseClient.auth.admin.deleteUser(userId);
                throw new Error('فشل إنشاء الملف الشخصي: ' + profileError.message);
            }

            // 5. معالجة الإحالة
            if (referredBy) {
                const { data: referrer } = await supabaseClient
                    .from('profiles')
                    .select('id, balance')
                    .eq('referral_code', referredBy)
                    .single();

                if (referrer) {
                    await supabaseClient
                        .from('profiles')
                        .update({ balance: (referrer.balance || 0) + 3 })
                        .eq('id', referrer.id);

                    await supabaseClient
                        .from('referrals')
                        .insert({
                            referrer_id: referrer.id,
                            referred_id: userId,
                            bonus_amount: 3,
                        });
                }
            }

            // 6. تحميل بيانات المستخدم
            await loadUserData(password);
            showApp();
            toast('تم إنشاء الحساب بنجاح! 🎉 رصيدك 10 POL', 'success');
            authSubmitBtn.disabled = false;
            authSubmitBtn.textContent = 'إنشاء حساب';
        }

        async function loadUserData(password) {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) throw new Error('لم يتم العثور على المستخدم');

            const { data: profile, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();

            if (error) {
                // إذا لم يكن هناك بروفايل، ننشئ واحداً تلقائياً (حالة نادرة)
                if (error.code === 'PGRST116') {
                    // محاولة إنشاء بروفايل
                    const wallet = await createWallet();
                    const encrypted = await encryptPrivateKey(wallet.privateKey, password);
                    const refCode = generateRefCode();
                    await supabaseClient.from('profiles').insert({
                        id: user.id,
                        email: user.email,
                        public_address: wallet.address,
                        encrypted_private_key: encrypted,
                        balance: 10,
                        referral_code: refCode,
                        is_admin: user.email === ADMIN_EMAIL,
                        is_banned: false,
                        username: user.email.split('@')[0],
                    });
                    // إعادة التحميل
                    return loadUserData(password);
                }
                throw new Error(error.message);
            }

            currentUser = {
                id: user.id,
                email: user.email,
                public_address: profile.public_address,
                balance: profile.balance || 0,
                referral_code: profile.referral_code,
                is_admin: profile.is_admin || false,
                is_banned: profile.is_banned || false,
                ban_expires: profile.ban_expires,
                username: profile.username || user.email.split('@')[0],
                encrypted_private_key: profile.encrypted_private_key,
            };

            encryptedPrivateKey = profile.encrypted_private_key;
            if (encryptedPrivateKey && password) {
                try {
                    decryptedPrivateKey = await decryptPrivateKey(encryptedPrivateKey, password);
                } catch {
                    decryptedPrivateKey = null;
                }
            }

            // التحقق من الحظر
            if (currentUser.is_banned) {
                const expires = currentUser.ban_expires;
                if (expires && new Date(expires) > new Date()) {
                    toast('🚫 أنت محظور مؤقتاً حتى ' + new Date(expires).toLocaleString(), 'error');
                } else if (!expires) {
                    toast('🚫 أنت محظور بشكل نهائي', 'error');
                }
            }

            updateUI();
            await loadRooms();
            await loadGameState();
            startGameLoop();
            startTimerLoop();
        }

        // =====================================================================

        function showApp() {
            authScreen.style.display = 'none';

            if (currentUser && currentUser.is_admin) {

        function updateUI() {
            if (!currentUser) return;
            headerBalance.textContent = (currentUser.balance || 0).toFixed(2) + ' POL';
            walletPolBalance.textContent = (currentUser.balance || 0).toFixed(2) + ' POL';
            walletAddress.textContent = currentUser.public_address || '0x...';
            referralLink.textContent = REFERRAL_BASE + '?ref=' + (currentUser.referral_code || '');
            generateQR(currentUser.public_address);
            updateWalletUsd();
            if (currentUser.is_admin) {
                adminPanel.classList.remove('hidden');
            } else {
                adminPanel.classList.add('hidden');
            }

            try {
                const price = await getPolPrice();
                const usd = (currentUser.balance || 0) * price;
                walletUsdBalance.textContent = '$' + usd.toFixed(2);

        function generateQR(address) {
            qrContainer.innerHTML = '';
            if (!address || address === '0x...') {
                qrContainer.innerHTML = '<div class="text-dim" style="padding:20px;">لا يوجد عنوان</div>';
                return;
            }
            try {
                new QRCode(qrContainer, {
                    text: address,
                    width: 120,
                    height: 120,
                    colorDark: '#000000',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.H,
                });
            } catch (e) {
                qrContainer.innerHTML = '<div class="text-dim" style="padding:20px;">⚠️ خطأ في إنشاء QR</div>';
            }
        }

        // =====================================================================
        //  CHAT & GAME (نفس الكود السابق، محذوف للاختصار)
        // =====================================================================
        // ... (جميع دوال المحادثة واللعبة كما هي، لم تتغير)

        // =====================================================================
        //  LOGOUT
        // =====================================================================
        logoutBtn.addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            decryptedPrivateKey = null;
            currentUser = null;
            location.reload();
        });

        // =====================================================================
        //  INIT
        // =====================================================================
        async function init() {
            const ref = getRefCode();
            if (ref) {
                referralBadge.classList.remove('hidden');
                referralBadge.textContent = '🎁 تمت الإحالة! ستحصل على 3 POL عند التسجيل';
            }

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                try {
                    await loadUserData(null);
                    showApp();
                } catch (e) {
                    toast('خطأ في استعادة الجلسة', 'error');
                    await supabaseClient.auth.signOut();
                }
            }
        }

        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_OUT') {
                location.reload();
            }
        });

        // رسم العجلة (مع التصحيح)
        function drawWheel() {
            const canvas = wheelCanvas;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const rect = canvas.parentElement?.getBoundingClientRect();
            if (!rect) return;
            let size = Math.min(rect.width, rect.height, 340);
            if (size < 20) size = 200;
            canvas.width = size;
            canvas.height = size;
            const cx = size / 2,
                cy = size / 2;
            const r = Math.max(10, size / 2 - 8);
            ctx.clearRect(0, 0, size, size);
            // ... رسم القطع ...
        }

        const ro = new ResizeObserver(() => drawWheel());
        const wheelWrapper = document.querySelector('.wheel-wrapper');
        if (wheelWrapper) ro.observe(wheelWrapper);
        setInterval(drawWheel, 2000);

        init().catch(console.error);

        window.addEventListener('load', () => {
            setTimeout(drawWheel, 500);
            if (!currentUser) {
                mainApp.style.display = 'none';
                authScreen.style.display = 'flex';
            }
        });

        console.log('🚀 VaultLine initialized');
        console.log('📧 Admin:', ADMIN_EMAIL);
        console.log('🔗 Referral base:', REFERRAL_BASE);
    </script>
